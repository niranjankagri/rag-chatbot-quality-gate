# Every push and pull request: lint, then every suite against a real HTTP server, then the gate.
# Runs offline with the deterministic generator: no model, no API key, no secret, same result each
# time, so it can be a required check. The real-model checks are in model-evals.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, without a code change: a broken dependency shows up within a week
    - cron: '40 23 * * 5'   # Friday 23:40 UTC
  workflow_dispatch:

# Grouped per event too, so the weekly run and a push run on main never cancel each other
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Tests, evaluations and quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: |
          pip install -e ".[dev]"
          npm ci

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # Starts the API on a free port, runs pytest (API + DeepEval), the retrieval eval, Ragas and
      # Promptfoo against it, then the gate (configs/quality_gate.toml)
      - name: Suites and quality gate
        env:
          PYTEST_ADDOPTS: --cov --cov-report=term-missing --cov-fail-under=90
        run: python -m qa.check_all

      - name: Gate table in the job summary
        if: ${{ !cancelled() }}
        run: cat reports/quality_gate.md >> "$GITHUB_STEP_SUMMARY" || echo "No gate table (an earlier step failed)" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the reports and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
