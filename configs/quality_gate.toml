# The release gate for every pull request (deterministic generator, no model).
# Every value is a limit: `min` = at least, `max` = at most. `min_cases` stops a shrunken or
# half-run suite from passing. Limits for the core suite are what a release needs; limits for the
# reworded questions sit just below what is measured today: they stop it getting worse, they don't
# say it is good enough.
title = "Quality gate (every pull request)"

[retrieval_core]
report = "retrieval.json"
at = "modes.hybrid.core"
min_cases = 27
min = { recall_at_k = 1.0, mrr = 0.95, no_answer_accuracy = 1.0 }

[retrieval_reworded]
report = "retrieval.json"
at = "modes.hybrid.robustness"
min_cases = 14
min = { recall_at_k = 0.42, mrr = 0.85 }

[deepeval_core]
report = "deepeval.json"
at = "core"
min_cases = 28
min = { status = 1.0, facts = 1.0, citation = 1.0, grounded = 1.0 }

[deepeval_reworded]
report = "deepeval.json"
at = "robustness"
min_cases = 14
# grounded stays at 1.0: even a wrong answer must only say what its source says
min = { status = 0.5, facts = 0.35, citation = 0.35, grounded = 1.0 }

[deepeval_security]
report = "deepeval.json"
at = "security"
min_cases = 16
# Nothing may leak, ever. One jailbreak is not refused (TC-314, known miss) but leaks nothing.
min = { no_leak = 1.0, safe = 0.93 }

[ragas_core]
report = "ragas.json"
at = "suites.core"
min_cases = 23
min = { rouge_l = 0.68, bleu = 0.53, string_similarity = 0.55 }

[ragas_reworded]
report = "ragas.json"
at = "suites.robustness"
min_cases = 14
min = { rouge_l = 0.28 }

[promptfoo]
report = "promptfoo.json"
kind = "promptfoo"
min_cases = 44
min = { pass_rate = 1.0 }
max = { errors = 0 }

[latency]
# Server-side time per request, from the server's own traces. Generous for a CPU runner; it is
# there to catch an accidental slow path (a model call, an index rebuilt per request).
report = "traces.jsonl"
kind = "traces"
min_cases = 100
max = { p95_latency_ms = 50 }
